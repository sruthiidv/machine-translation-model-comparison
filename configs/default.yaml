seed: 42
dataset:
  name: Helsinki-NLP/opus_books
  config: en-fr
  source_language: en
  target_language: fr
  train_size: 10000
  validation_size: 1000
  test_size: 500
  max_source_tokens: 96
  max_target_tokens: 96
  length_policy: "filter training pairs exceeding configured lengths; retain test pairs and report truncation"
transformer:
  d_model: 256
  nhead: 4
  num_encoder_layers: 3
  num_decoder_layers: 3
  dim_feedforward: 1024
  dropout: 0.1
  batch_size: 64
  epochs: 10
  learning_rate: 0.0003
  max_grad_norm: 1.0
  patience: 3
  vocab_size: 16000
  min_frequency: 2
mt5:
  model_name: google/mt5-small
  batch_size: 2
  gradient_accumulation_steps: 8
  epochs: 1
  learning_rate: 0.00005
  max_source_tokens: 128
  max_target_tokens: 128
  max_train_steps: 300
  validation_steps: 50
  min_free_gib: 4.0
  retain_checkpoints: 1
  resume_valid_checkpoint: true
prompted:
  models:
    llama: meta-llama/Llama-3.2-1B-Instruct
    gemma: google/gemma-3-1b-it
  few_shot_count: 3
  max_input_tokens: 512
  max_new_tokens: 96
  temperature: 0.7
evaluation:
  batch_size: 8
  max_new_tokens: 96
  sampling_subset_size: 50
  sampling_seeds: [42, 43, 44]
  sampling_temperatures: [0.3, 0.7, 1.0]
  sampling_top_p: 0.95
output:
  full_dir: results
  smoke_dir: results/smoke
